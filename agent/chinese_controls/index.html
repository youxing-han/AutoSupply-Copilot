<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}#root{display:flow-root;padding-bottom:6px}body{margin:0;background:white;color:#234034;font:13px/1.5 "Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cddfd3;background:#f5faf5;color:#176b51;border-radius:6px;padding:7px 11px}button:disabled{opacity:.4;cursor:default}input,select{padding:6px 8px;border:1px solid #d3e3d8;border-radius:5px;background:white;color:#234034;max-width:170px;min-width:80px;width:100%}input[type=checkbox]{width:auto;min-width:0}input:focus,select:focus,button:focus-visible{outline:2px solid #77ae8c}table{border-collapse:collapse;width:100%;font-size:12px}th{font-weight:400;text-align:left;color:#5d7666;padding:8px;background:#edf6ef;white-space:nowrap}td{padding:6px 7px;border-bottom:1px solid #e4ede5;white-space:nowrap}.scroll{overflow-x:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.toolbar select{width:auto}.error{color:#ae4936;margin:6px 0}.drop{border:1px dashed #b4d0bd;border-radius:9px;padding:14px;background:#f2f8f3;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#61786a;font-size:12px}.file{font-size:12px;overflow-wrap:anywhere}.selected{background:#eff7f0}
</style><body><div id="root"></div><script>
const root=document.getElementById('root');let args={},rows=[],page=0,filter='',lastSent='',lastServer='',editRevision=0,upload=null;
const post=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const height=()=>requestAnimationFrame(()=>post('streamlit:setFrameHeight',{height:Math.ceil(Math.max(root.getBoundingClientRect().height,root.scrollHeight))+4}));
const emit=value=>post('streamlit:setComponentValue',{value,dataType:'json'});
function sendRows(){lastSent=JSON.stringify(rows);editRevision++;emit({rows,edit_id:editRevision});}
function text(tag,value){const el=document.createElement(tag);el.textContent=value;return el;}
function readFile(file){if(!file)return;if(file.size>5_000_000){root.append(text('div','文件超过5MB，请缩小文件后重试。'));height();return;}const suffix='.'+file.name.split('.').pop().toLowerCase();if(!args.accept.split(',').includes(suffix)){root.append(text('div','文件类型不支持，请选择指定格式。'));height();return;}const reader=new FileReader();reader.onload=()=>{upload={name:file.name,data:String(reader.result).split(',')[1]};emit(upload);drawUpload();};reader.onerror=()=>{root.append(text('div','文件读取失败，请重新选择。'));height();};reader.readAsDataURL(file);}
function drawUpload(){root.replaceChildren();const box=document.createElement('div');box.className='drop';const label=text('span',args.label),button=text('button','选择文件'),input=document.createElement('input');input.type='file';input.accept=args.accept;input.hidden=true;button.type='button';button.onclick=()=>input.click();input.onchange=()=>readFile(input.files[0]);box.ondragover=e=>e.preventDefault();box.ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])};box.append(label,button,input,text('span','也可将文件拖到这里 · 最大5MB'));root.append(box);if(upload||args.filename){const status=text('div',upload?.name||args.filename);status.className='file';root.append(status);}height();}
function drawEditor(){root.replaceChildren();const toolbar=document.createElement('div');toolbar.className='toolbar';if(args.filterColumn){const select=document.createElement('select');select.setAttribute('aria-label','筛选物料');const values=[...new Set(rows.map(r=>r[args.filterColumn]))];if(!values.includes(filter))filter=values[0]||'';for(const v of values){const o=text('option',v||'未填写编码');o.value=v;select.append(o)}select.value=filter;select.onchange=()=>{filter=select.value;page=0;drawEditor()};toolbar.append(select);}toolbar.append(text('span','可直接修改单元格，修改后需重新分析'));if(args.add){const add=text('button','新增一行');add.onclick=()=>{rows.push(JSON.parse(JSON.stringify(args.defaults)));if(args.filterColumn)filter=rows.at(-1)[args.filterColumn]||'';page=Math.floor((rows.length-1)/10);sendRows();drawEditor()};toolbar.append(add);}root.append(toolbar);
 const list=rows.map((r,i)=>({r,i})).filter(({r})=>!args.filterColumn||r[args.filterColumn]===filter);if(page*10>=list.length)page=0;
 const wrap=document.createElement('div');wrap.className='scroll';const table=document.createElement('table'),head=document.createElement('tr');for(const c of args.columns)head.append(text('th',c.label));if(args.add)head.append(text('th','操作'));const thead=document.createElement('thead');thead.append(head);table.append(thead);const body=document.createElement('tbody');
 for(const {r,i} of list.slice(page*10,page*10+10)){const tr=document.createElement('tr');for(const c of args.columns){const td=document.createElement('td');let input;if(!c.editable){const choice=(c.choices||[]).find(x=>x.value===r[c.name]);td.textContent=choice?.label??args.labels?.[String(r[c.name])]??String(r[c.name]??'—');}else{if(c.type==='select'){input=document.createElement('select');for(const opt of c.choices){const option=text('option',opt.label);option.value=opt.value;input.append(option);}input.value=r[c.name]??c.choices[0]?.value;}else{input=document.createElement('input');input.type=c.type==='boolean'?'checkbox':c.type==='number'?'number':c.type==='date'?'date':'text';if(c.type==='number'){input.min='0';input.step='1'}if(c.type==='boolean')input.checked=Boolean(r[c.name]);else input.value=r[c.name]??'';}input.setAttribute('aria-label',c.label);input.onchange=()=>{r[c.name]=c.type==='number'?(input.value===''?'':Number(input.value)):c.type==='boolean'?input.checked:input.value;sendRows()};td.append(input);}tr.append(td);}if(args.add){const td=document.createElement('td'),del=text('button','删除');del.onclick=()=>{rows.splice(i,1);sendRows();drawEditor()};td.append(del);tr.append(td)}body.append(tr);}table.append(body);wrap.append(table);root.append(wrap);
 const footer=document.createElement('div');footer.className='toolbar';footer.append(text('span',`共${list.length}行 · 第${page+1}页`));const prev=text('button','上一页'),next=text('button','下一页');prev.disabled=page===0;next.disabled=(page+1)*10>=list.length;prev.onclick=()=>{page--;drawEditor()};next.onclick=()=>{page++;drawEditor()};footer.append(prev,next);root.append(footer);height();}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;const next=e.data.args;if(next.kind==='editor'){const incoming=JSON.stringify(next.rows);args=next;const acknowledged=Number(next.editRevision||0);if(acknowledged<editRevision&&root.children.length)return;if(incoming!==lastSent&&incoming!==lastServer||!root.children.length){rows=JSON.parse(incoming);lastSent=incoming;drawEditor()}lastServer=incoming;editRevision=Math.max(editRevision,acknowledged);}else{args=next;drawUpload()}height()});
new ResizeObserver(height).observe(root);
post('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
