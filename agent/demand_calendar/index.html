<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#183e32;background:white;font:13px/1.6 'Microsoft YaHei',sans-serif}.wrap{overflow:auto;border:1px solid #dce9df;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:820px}th,td{padding:11px 8px;text-align:center;border-bottom:1px solid #e5eee8}th{font-weight:500;background:#edf6f0;color:#526b5d}th:first-child,td:first-child{text-align:left;min-width:165px}small{display:block;font-size:11px;color:#778b7c}.qty{color:#176b51;background:#eff8f2}.off{color:#98a59d;background:#f6f7f6}.missing{background:#fff3d8;color:#986711}input{font:inherit;width:68px;padding:7px 3px;border:1px solid #8db79e;border-radius:5px;background:white;color:#174f3b;text-align:center}tfoot{font-weight:600;background:#edf6f0}.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;color:#61786a}button{font:inherit;color:#176b51;background:white;border:1px solid #c9dfd1;padding:6px 12px;border-radius:6px;cursor:pointer}button:disabled{opacity:.4}.total{font-weight:600}.error{color:#a62935}
</style><body><div id="root"></div><script>
const root=document.getElementById('root');let args={},rows=[],page=0,seq=0,signature='';
const post=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const height=()=>requestAnimationFrame(()=>post('streamlit:setFrameHeight',{height:Math.ceil(root.getBoundingClientRect().height)+2}));
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;}
function draw(){root.replaceChildren();const grid=args.grid,wrap=el('div',undefined,'wrap'),table=el('table'),head=el('tr');head.append(el('th','物料 / 名称'));for(const d of grid.dates){const h=el('th',d.weekday);h.append(el('small',d.date.slice(5)));if(!d.in_period)h.append(el('small','非预测期'));head.append(h)}head.append(el('th','周合计'));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');if(page*10>=grid.rows.length)page=0;
for(const r of grid.rows.slice(page*10,page*10+10)){const tr=el('tr'),name=el('td',r.part_code);name.append(el('small',r.part_name));tr.append(name);grid.dates.forEach((d,i)=>{const v=r.values[i],td=el('td',undefined,!d.in_period?'off':v===null||v===''?'missing':v>0?'qty':'');if(args.editing&&d.in_period){const input=el('input');input.type='number';input.min='0';input.step='1';input.value=v??'';input.placeholder='待填';input.setAttribute('aria-label',`${r.part_code} ${d.date} 需求`);input.onchange=()=>{if(input.value===''||!Number.isSafeInteger(Number(input.value))||Number(input.value)<0){input.setCustomValidity('请输入非负整数');input.reportValidity();}else input.setCustomValidity('');let row=rows.find(x=>x.part_code===r.part_code&&x.date===d.date);if(row)row.quantity=input.value===''?'':Number(input.value);else rows.push({part_code:r.part_code,date:d.date,quantity:input.value===''?'':Number(input.value)});seq++;post('streamlit:setComponentValue',{value:{rows,edit_id:seq},dataType:'json'})};td.append(input)}else td.textContent=v===null||v===''?'待填':v;tr.append(td)});tr.append(el('td',r.total??'待填','total'));body.append(tr)}table.append(body);const foot=el('tfoot'),total=el('tr');total.append(el('td','筛选物料合计'));for(const n of grid.totals)total.append(el('td',n??'待填'));total.append(el('td',grid.totals.some(v=>v===null)?'待填':grid.totals.reduce((a,b)=>a+b,0)));foot.append(total);table.append(foot);wrap.append(table);root.append(wrap);const tools=el('div',undefined,'tools');tools.append(el('span',`共${grid.rows.length}种物料 · 第${page+1}/${Math.max(1,Math.ceil(grid.rows.length/10))}页 · 合计含全部筛选物料`));const prev=el('button','上一页'),next=el('button','下一页');prev.disabled=page===0;next.disabled=(page+1)*10>=grid.rows.length;prev.onclick=()=>{page--;draw()};next.onclick=()=>{page++;draw()};tools.append(prev,next);root.append(tools);height()}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;const next=e.data.args;if(Number(next.editRevision||0)<seq&&root.children.length)return;const sig=JSON.stringify([next.grid,next.editing]);args=next;rows=structuredClone(next.rows);seq=Math.max(seq,Number(next.editRevision||0));if(sig!==signature){signature=sig;draw()}height()});new ResizeObserver(height).observe(root);post('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
